[general]
resolution=5

[discord]
enableactivitystatus=true

[clienthax]
nobulb=true
customcolor=true
; Movement during attacks (launcher Game options). Each key controls one patch:
;   attackwalk  - keep walking while an attack plays (the "slide"). Default false
;                 = vanilla: attacks stop you.
;   attackjump  - jump while an attack animation plays. Default true.
;   chargemove  - move while charging keydown skills. Default true.
; Precedence: a key set here always wins for its own patch. When attackjump or
; chargemove is missing it follows the legacy MapleRoot moveattack= (default
; true; moveattack=false turns both off). attackwalk never follows moveattack:
; it is off unless attackwalk=true.
attackwalk=false
attackjump=true
chargemove=true
; doubletapjump - press jump again in the air to use your Ninja Bounce, exactly as
;                 its hotkey would (same skill, same strength). Never Flash Jump or
;                 Vertical Bounce. Holding jump never bounces. Default false.
;                 Bounces do nothing on the server's blocked maps (jump quests).
doubletapjump=false
; invresize - drag the item inventory's right edge, bottom edge or corner to 4-16
;             columns x 3-14 rows; the size is kept per character and the expand
;             button switches 4 <-> 8 columns. false = the stock 4x6 window with
;             its 4-tab expanded view. Default true.
invresize=true
; lowdefensepenalty - stock v83 adds damage when a mob touches you and your
;             defence is below the standard for your job and level, scaled
;             by your stats (admins took ~900 from snails). false = defence
;             only ever reduces damage. Default false.
lowdefensepenalty=false
; settingswindow - the in-game HUD (Ctrl+F10 HUD window, Ctrl+F11 freeze). Default true.
settingswindow=true
ChairOpacity=255
SkillOpacity=255

[weather]
; sway     - plants, trees, hanging signs, ropes and ladders bend in the wind.
;            false = nothing bends. Default true.
; ropesway - ropes and ladders bend with the rest. false = they stay exactly as
;            the map draws them (plants still bend). Default true.
sway=true
ropesway=true

[graphics]
; borderless     - no window frame: the game sits centred on its monitor, and at the
;                  monitor's own resolution it covers the screen (fullscreen look,
;                  fast alt-tab). Nothing is scaled. Default false.
; dpiaware       - on a scaled display (125-200%), show the game pixel for pixel
;                  instead of Windows' blurred upscale. Default false.
borderless=false
dpiaware=false
; d3d9host       - log the Direct3D 9 start-up (adapters, failing calls) to
;                  integration.log and host the in-game overlay. Default true.
; adapterfallback - when the game cannot create its device (e.g. Parsec or another
;                  virtual display is the main display), retry on the other
;                  adapters, then with software vertex processing. Default true.
d3d9host=true
adapterfallback=true

[config]
host=127.0.0.1
port=8485